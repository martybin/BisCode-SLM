[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeslm"
version = "0.1.0"
description = "From-scratch decoder-only coding small language model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marty" }]
dependencies = [
    "PyYAML>=6.0.3",
    "numpy>=2",
    "torch>=2.5",
    "tokenizers>=0.20",
    "datasets>=3",
    "safetensors>=0.4",
    "tensorboard>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
track = ["mlflow>=2"]

[project.scripts]
codeslm-validate-configs = "codeslm.config.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
