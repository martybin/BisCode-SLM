# Initial corpus. Download is off.
# Approving implementation of the pipeline does not approve a download.
# Flip download_enabled only after an explicit review of docs/DATASET_SELECTION.md.

schema_version: 1
name: initial-python-permissive
download_enabled: false
streaming: true

# Tokenizer training may read role: train only.
tokenizer:
  train_on: train
  forbid_roles: [validation, test, benchmark]

mixture:
  # Actual mixture given the sources enabled below.
  # The multilingual targets stay at 0 until a reviewed source is enabled.
  python: 1.0
  javascript: 0.0
  typescript: 0.0
  java: 0.0
  c: 0.0
  cpp: 0.0
  go: 0.0
  rust: 0.0
  sql: 0.0
  bash: 0.0

license:
  allow:
    - apache-2.0
    - mit
    - bsd-2-clause
    - bsd-3-clause
    - isc
    - unlicense
    - cc0-1.0
  # Known labels that must not enter training. Anything else is quarantined.
  exclude:
    - gpl-2.0
    - gpl-3.0
    - agpl-3.0
    - lgpl-2.1
    - lgpl-3.0
    - mpl-2.0
    - epl-1.0
    - artistic-2.0
  quarantine_unknown: true

filters:
  min_chars: 100
  max_chars: 200000
  drop_autogenerated: true
  drop_empty: true
  max_files_per_repo: 1000

dedup:
  exact: true
  minhash: true
  jaccard_threshold: 0.85

split:
  strategy: repository
  train_repo: codeparrot/codeparrot-clean-train
  validation_repo: codeparrot/codeparrot-clean-valid
  drop_train_repos_seen_in_validation: true

sources:
  - id: codeparrot_clean_train
    repo_id: codeparrot/codeparrot-clean-train
    split: train
    role: train
    enabled: true
    language: python
    streaming: true
    revision: null
    # First approved pull. Not a Chinchilla corpus.
    max_kept_files: 20000

  - id: codeparrot_clean_valid
    repo_id: codeparrot/codeparrot-clean-valid
    # The Hub split inside this validation repository is named "train".
    split: train
    role: validation
    enabled: true
    language: python
    streaming: true
    revision: null
    max_kept_files: 5000

  - id: the_stack_v2
    repo_id: bigcode/the-stack-v2
    role: blocked
    enabled: false
    reason: gated metadata index, no file contents, bulk download needs a Software Heritage agreement

  - id: the_stack_v2_train_smol_ids
    repo_id: bigcode/the-stack-v2-train-smol-ids
    role: blocked
    enabled: false
    reason: gated identifier list, no file contents

  - id: starcoder2_smol_files
    repo_id: starcoder2data/the-stack-v2-train-smol-files
    role: blocked
    enabled: false
    reason: 401 without authorization on 2026-11-12

  - id: code_search_net
    repo_id: code-search-net/code_search_net
    role: blocked
    enabled: false
    reason: card license is other and per-example licenses are absent

  - id: magicoder_evol_instruct
    repo_id: ise-uiuc/Magicoder-Evol-Instruct-110K
    role: future_sft
    enabled: false
    reason: instruction data, excluded from base pretraining

  - id: code_feedback
    repo_id: m-a-p/Code-Feedback
    role: future_sft
    enabled: false
    reason: instruction data, excluded from base pretraining

  - id: code_alpaca_20k
    repo_id: sahil2801/CodeAlpaca-20k
    role: future_sft
    enabled: false
    reason: instruction data, excluded from base pretraining

reports:
  manifest: data/dataset_manifest.yaml
  license_report: data/reports/license_report.json
  statistics: data/reports/dataset_statistics.json
